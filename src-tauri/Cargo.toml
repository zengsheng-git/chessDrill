[package]
name = "chessdrill"
version = "0.1.0"
description = "杀法练习 - 中国象棋残局刷题"
edition = "2021"

[lib]
name = "chessdrill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true
